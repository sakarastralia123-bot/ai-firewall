<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 250px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
    }
    .header {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 16px;
      color: #0F172A;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background-color: #F8FAFC;
      border-radius: 8px;
      border: 1px solid #E2E8F0;
    }
    .status-text {
      font-size: 14px;
      font-weight: 500;
      color: #64748B;
    }
    .status-text.active {
      color: #10B981;
    }
    /* Toggle Switch CSS */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #CBD5E1;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #10B981;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
  </style>
</head>
<body>
  <div class="header">
    <span>AI Firewall</span>
  </div>
  <div class="status-container">
    <span id="statusText" class="status-text">Status: OFF</span>
    <label class="switch">
      <input type="checkbox" id="toggleSwitch">
      <span class="slider"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
